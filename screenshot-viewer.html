<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Screenshot | Breadcrumb</title>

    <link rel="stylesheet" href="screenshot-viewer.css">
</head>

<body>
    <main class="viewer">
        <header class="viewer-header">
            <div>
                <p class="eyebrow">BREADCRUMB</p>
                <h1 id="screenshot-title">Saved screenshot</h1>
            </div>

            <button id="close-button" type="button">
                Close
            </button>
        </header>

        <p id="viewer-status">
            Loading screenshot...
        </p>

        <div class="image-frame">
            <img
                id="screenshot-image"
                alt=""
                hidden
            >
        </div>
    </main>

    <script
        type="module"
        src="screenshot-viewer.js"
    ></script>
</body>
</html>
